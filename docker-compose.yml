version: '3.8'
services:
  copymanga-web:
    image: ghcr.io/mogvl/copymanga-web:latest

    container_name: copymanga-web
    ports:
      - "3000:8080"
    environment:
      # 下载目录（容器内路径）
      - DOWNLOAD_DIR=/downloads
      - STATIC_DIR=/app/static
      - PORT=8080
      # 可选：图片并发数、重试次数、章节间隔（缓解风控）
      - IMAGE_CONCURRENCY=5
      - IMAGE_RETRY=3
      - CHAPTER_INTERVAL_SEC=0
    volumes:
      # !!! 重要: 把 /volume1/漫画 改成你存漫画的路径 !!!
      - /volume1/漫画:/downloads
    restart: unless-stopped
