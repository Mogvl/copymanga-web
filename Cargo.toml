[package]
name = "copymanga-web"
version = "0.1.0"
edition = "2021"
description = "拷贝漫画 copymanga 的 Web 下载服务"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "native-tls", "gzip"] }
reqwest-middleware = "0.4"
reqwest-retry = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Templating
minijinja = { version = "2", features = ["builtins", "json"] }

# Utilities
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
